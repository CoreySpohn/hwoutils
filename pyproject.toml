[build-system]
requires = ['hatchling', "hatch-fancy-pypi-readme", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "hwoutils"
description = "Shared JAX-based utilities for the HWO direct imaging simulation suite — constants, conversions, and image transforms."
authors = [{ name = "Corey Spohn", email = "corey.a.spohn@nasa.gov" }]
dynamic = ['readme', 'version']
requires-python = ">=3.12"
license = { file = "LICENSE" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = ["jax>=0.8.1", "jaxlib>=0.8.1", "numpy>=2.0"]
[project.optional-dependencies]
dev = ["pre-commit"]
docs = [
  "sphinx",
  "myst-nb",
  "sphinx-book-theme",
  "sphinx-autoapi",
  "sphinx_autodoc_typehints",
  "ipython",
  "matplotlib",
]
test = [
  "pytest>=7.3.2",
  "hypothesis>=6.79.1",
  "psutil>=5.9.4",
  "pytest-xdist>=3.4",
  "pytest-testmon>=2.0.7",
  "pytest-markdown-docs>=0.1.0",
  "pytest-timeout>=1.3.1",
  "pytest-fail-slow>=0.1.0",
  "astropy>=6.1",
  "numpy>=2.0",
  "scipy>=1.13",
]

[project.scripts]
testbudget = "hwoutils.testbudget.cli:main"

[project.urls]
Homepage = "https://github.com/CoreySpohn/hwoutils"
Issues = "https://github.com/CoreySpohn/hwoutils/issues"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/hwoutils/_version.py"

[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[tool.ruff.lint]
select = ["B", "D", "E", "F", "I", "UP", "RUF", "NPY"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]  # test functions / fixtures do not need docstrings

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = ["astropy", "hypothesis"]

[tool.hatch.build.targets.wheel]
packages = ["src/hwoutils"]

[tool.hatch.build.targets.sdist]
exclude = ["/scripts", "/docs", "/tests", "/.github"]

[tool.pytest.ini_options]
filterwarnings = ["error"]
markers = [
  "medium: tests with a 30-second default time budget",
  "slow: tests with a 300-second default time budget, run nightly",
]

[tool.testbudget]
library = "hwoutils"
mode = "report"
unit_s = 5
medium_s = 30
slow_s = 300

[tool.deptry]
known_first_party = ["hwoutils"]
optional_dependencies_dev_groups = ["dev", "docs", "test"]

[tool.deptry.per_rule_ignores]
# JAX loads its compiled backend; keep the explicit minimum version constraint.
DEP002 = ["jaxlib"]
# The optional testbudget plugin imports pytest and uses psutil when available;
# both are supplied by the test extra, with a stdlib fallback for psutil.
DEP004 = ["pytest", "psutil"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["src/hwoutils"]
